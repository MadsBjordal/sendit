# Local development database (PostgreSQL 16 + PostGIS). Data stays in the "freight-db" volume.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freight
    ports:
      - '5434:5432'
    volumes:
      - freight-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  freight-db:
